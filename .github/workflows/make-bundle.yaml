name: Make bundle

on:
  workflow_dispatch:
    inputs:
      api-base-url:
        description: Base URL of the Kerberos API the bundle talks to
        required: true
        default: https://api.trebent.se
        type: string

permissions:
  contents: read

jobs:
  make-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Angular CLI
        run: make install/cli

      - name: Install dependencies
        run: make install

      - name: Set API base URL
        env:
          API_BASE_URL: ${{ inputs.api-base-url }}
        run: |
          node -e '
            const fs = require("fs");
            const url = process.env.API_BASE_URL;
            new URL(url); // fail fast on an invalid URL
            fs.writeFileSync(
              "src/environments/environment.prod.ts",
              `export const environment = {\n  production: true,\n  apiBaseUrl: ${JSON.stringify(url)},\n};\n`,
            );
          '
          cat src/environments/environment.prod.ts

      - name: Generate production bundle
        run: make build/prod

      - name: Package production bundle
        run: tar -czf kerberos-fe.tar.gz dist/kerberos-fe

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kerberos-fe-bundle
          path: kerberos-fe.tar.gz
