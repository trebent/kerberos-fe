name: Make bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v6.4.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: make install

      - name: Generate production bundle
        run: make build/prod

      - name: Package production bundle
        run: tar -czf kerberos-fe.tar.gz dist/kerberos-fe

      - name: Upload production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kerberos-fe-bundle
          path: kerberos-fe.tar.gz
