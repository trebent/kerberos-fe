name: Make bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@680d1e489b82f1243de15bc7665c0007e3c9a860 # v6.4.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: make install

      - name: Generate production bundle
        run: make build/prod

      - name: Package production bundle
        run: tar -czf kerberos-fe.tar.gz dist/kerberos-fe

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kerberos-fe-bundle
          path: kerberos-fe.tar.gz
