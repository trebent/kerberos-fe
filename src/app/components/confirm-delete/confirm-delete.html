<h2 mat-dialog-title>Delete {{ data.what }}?</h2>
<mat-dialog-content>
  <p>This cannot be undone.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" mat-dialog-close cdkFocusInitial>Cancel</button>
  <button matButton="filled" type="button" class="danger-button" [mat-dialog-close]="true">
    Delete
  </button>
</mat-dialog-actions>
