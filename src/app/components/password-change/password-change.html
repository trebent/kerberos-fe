<app-request-feedback [status]="status" />

<form class="compact-form" [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline">
    <mat-label>Current password</mat-label>
    <input matInput type="password" formControlName="oldPassword" autocomplete="current-password" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>New password</mat-label>
    <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Confirm new password</mat-label>
    <input
      matInput
      type="password"
      formControlName="confirmPassword"
      autocomplete="new-password"
      [errorStateMatcher]="mismatchMatcher"
    />
    @if (form.hasError('passwordsMismatch') && form.controls.confirmPassword.touched) {
      <mat-error>Passwords do not match.</mat-error>
    }
  </mat-form-field>

  <div class="form-actions">
    <button matButton="filled" type="submit" [disabled]="form.invalid || status.pending()">
      Change password
    </button>
  </div>
</form>
