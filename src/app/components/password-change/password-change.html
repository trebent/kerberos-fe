<app-request-feedback [status]="status" />

<form class="compact-form" [formRoot]="form">
  <mat-form-field appearance="outline">
    <mat-label>Current password</mat-label>
    <input
      matInput
      type="password"
      [formField]="form.oldPassword"
      autocomplete="current-password"
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>New password</mat-label>
    <input matInput type="password" [formField]="form.newPassword" autocomplete="new-password" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Confirm new password</mat-label>
    <input
      matInput
      type="password"
      [formField]="form.confirmPassword"
      autocomplete="new-password"
    />
    @if (form.confirmPassword().getError('mismatch')) {
      <mat-error>Passwords do not match.</mat-error>
    }
  </mat-form-field>

  <div class="form-actions">
    <button matButton="filled" type="submit" [disabled]="form().invalid() || status.pending()">
      Change password
    </button>
  </div>
</form>
