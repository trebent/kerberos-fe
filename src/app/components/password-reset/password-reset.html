<app-request-feedback [status]="status" />

<form class="dialog-form" [formRoot]="form">
  <mat-form-field appearance="outline">
    <mat-label>New password</mat-label>
    <input matInput type="password" [formField]="form.newPassword" autocomplete="new-password" />
    <mat-hint>10 to 64 characters</mat-hint>
    @if (form.newPassword().getError('minLength') || form.newPassword().getError('maxLength')) {
      <mat-error>Use 10 to 64 characters.</mat-error>
    }
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Confirm new password</mat-label>
    <input
      matInput
      type="password"
      [formField]="form.confirmPassword"
      autocomplete="new-password"
    />
    @if (form.confirmPassword().getError('mismatch')) {
      <mat-error>Passwords do not match.</mat-error>
    }
  </mat-form-field>

  <p class="reset-note">Resetting ends all of this user's sessions.</p>

  <div class="form-actions">
    <button matButton="filled" type="submit" [disabled]="form().invalid() || status.pending()">
      Reset password
    </button>
  </div>
</form>
