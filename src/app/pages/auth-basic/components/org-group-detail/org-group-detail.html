<app-edit-panel heading="Edit group" (closed)="closed.emit()">
  <app-request-feedback [status]="saveStatus" />

  <form [formGroup]="editForm" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
    <div class="form-actions">
      <button
        matButton="filled"
        type="submit"
        [disabled]="editForm.invalid || saveStatus.pending()"
      >
        Save
      </button>
    </div>
  </form>
</app-edit-panel>
