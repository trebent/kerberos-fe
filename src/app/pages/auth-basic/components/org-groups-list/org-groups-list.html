<app-list-card
  heading="Groups"
  createHeading="Create group"
  listHeading="All groups"
  [resource]="groupsResource"
  loadError="Failed to load groups."
  [prompt]="orgId() === null ? 'Select an organisation to manage its groups.' : null"
>
  <div create>
    <app-request-feedback [status]="createStatus" />
    <form class="compact-form" [formGroup]="createForm" (ngSubmit)="submitCreate()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      <div class="form-actions">
        <button
          matButton="filled"
          type="submit"
          [disabled]="createForm.invalid || createStatus.pending()"
        >
          Create
        </button>
      </div>
    </form>
  </div>

  <app-request-feedback [status]="deleteStatus" />
  <app-filtered-table [dataSource]="dataSource" filterExample="admins">
    <table mat-table [dataSource]="dataSource">
      <mat-text-column name="id" headerText="ID" />
      <mat-text-column name="name" />
      <ng-container matColumnDef="actions" stickyEnd>
        <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
        <td mat-cell *matCellDef="let g">
          <app-row-actions
            [label]="'group ' + g.name"
            (edit)="selectedGroup.set(g)"
            (delete)="deleteGroup(g)"
          />
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </app-filtered-table>

  @if (selectedGroup(); as group) {
    <app-rename-panel
      heading="Edit group"
      [item]="group"
      [rename]="renameGroup"
      (saved)="onDetailSaved()"
      (closed)="selectedGroup.set(null)"
    />
  }
</app-list-card>
