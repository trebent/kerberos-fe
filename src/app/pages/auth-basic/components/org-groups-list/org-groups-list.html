<app-list-card
  heading="Groups"
  addLabel="Add group"
  filterExample="admins"
  [resource]="groupsResource"
  [dataSource]="dataSource"
  (add)="addGroup()"
>
  <app-request-feedback [status]="deleteStatus" />
  <table mat-table [dataSource]="dataSource">
    <mat-text-column name="id" headerText="ID" />
    <mat-text-column name="name" />
    <ng-container matColumnDef="actions" stickyEnd>
      <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
      <td mat-cell *matCellDef="let g">
        <app-row-actions
          [label]="'group ' + g.name"
          (edit)="renameGroup(g)"
          (delete)="deleteGroup(g)"
        />
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</app-list-card>
