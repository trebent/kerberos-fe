<app-edit-dialog heading="Edit user">
  <app-request-feedback [status]="saveStatus" />

  <form class="dialog-form" [formRoot]="form">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput cdkFocusInitial [formField]="form.name" autocomplete="off" />
    </mat-form-field>

    <app-checkbox-group
      legend="Groups"
      [items]="groupsResource.value()?.all ?? []"
      [loading]="groupsResource.isLoading()"
      [selection]="selectedGroups"
    />
    @if (groupsResource.error()) {
      <app-error-display [errors]="['Failed to load groups. Saving changes only the name.']" />
    }

    <div class="form-actions">
      <button matButton type="button" [mat-dialog-close]="undefined">Cancel</button>
      <button
        matButton="filled"
        type="submit"
        [disabled]="form().invalid() || saveStatus.pending() || groupsResource.isLoading()"
      >
        Save
      </button>
    </div>
  </form>

  <mat-divider />

  <h3 class="password-heading">Change password</h3>
  <app-password-change [change]="changePassword" />
</app-edit-dialog>
