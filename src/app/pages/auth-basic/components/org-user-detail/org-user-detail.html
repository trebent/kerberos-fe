<app-edit-dialog heading="Edit user">
  <h3>Name</h3>

  <app-request-feedback [status]="nameStatus" />

  <form class="compact-form" [formRoot]="nameForm">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput cdkFocusInitial [formField]="nameForm.name" autocomplete="username" />
    </mat-form-field>
    <div class="form-actions">
      <button
        matButton="filled"
        type="submit"
        [disabled]="nameForm().invalid() || nameStatus.pending()"
      >
        Save name
      </button>
    </div>
  </form>

  <h3>Groups</h3>

  @if (groupsResource.isLoading()) {
    <mat-spinner diameter="24" aria-label="Loading" />
  }
  @if (groupsResource.error()) {
    <app-error-display [errors]="['Failed to load groups.']" />
  }
  <app-request-feedback [status]="groupsStatus" />

  @if (groupsResource.hasValue() && groupsResource.value().all.length) {
    <app-checkbox-group
      legend="Select groups"
      [items]="groupsResource.value().all"
      [selection]="selectedGroups"
    />
    <div class="form-actions">
      <button
        matButton="filled"
        type="button"
        [disabled]="groupsStatus.pending()"
        (click)="saveGroups()"
      >
        Save groups
      </button>
    </div>
  }

  <h3>Change password</h3>
  <app-password-change [change]="changePassword" />
</app-edit-dialog>
