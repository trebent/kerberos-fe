<app-list-card
  heading="Users"
  createHeading="Create user"
  listHeading="All users"
  [resource]="usersResource"
  loadError="Failed to load users."
  [prompt]="orgId() === null ? 'Select an organisation to manage its users.' : null"
>
  <div create>
    <app-request-feedback [status]="createStatus" />
    <form class="compact-form" [formRoot]="createForm">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput [formField]="createForm.name" autocomplete="username" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          [formField]="createForm.password"
          autocomplete="new-password"
        />
      </mat-form-field>
      <div class="form-actions">
        <button
          matButton="filled"
          type="submit"
          [disabled]="createForm().invalid() || createStatus.pending()"
        >
          Create
        </button>
      </div>
    </form>
  </div>

  <app-request-feedback [status]="deleteStatus" />
  <app-filtered-table [dataSource]="dataSource" filterExample="admin">
    <table mat-table [dataSource]="dataSource">
      <mat-text-column name="id" headerText="ID" />
      <mat-text-column name="name" />
      <ng-container matColumnDef="groups">
        <th mat-header-cell *matHeaderCellDef>Groups</th>
        <td mat-cell *matCellDef="let u">
          {{ joinNames(u.groups) }}
        </td>
      </ng-container>
      <ng-container matColumnDef="actions" stickyEnd>
        <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
        <td mat-cell *matCellDef="let u">
          <app-row-actions
            [label]="'user ' + u.name"
            (edit)="selectedUser.set(u)"
            (delete)="deleteUser(u)"
          />
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </app-filtered-table>

  @let org = orgId();
  @if (selectedUser(); as user) {
    @if (org !== null) {
      <app-org-user-detail
        [orgId]="org"
        [user]="user"
        (changed)="usersResource.reload()"
        (closed)="selectedUser.set(null)"
      />
    }
  }
</app-list-card>
