<div class="edit-header">
  <h3 class="edit-title">Edit Organisation</h3>
  <button matIconButton type="button" (click)="close()" aria-label="Close edit panel">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>

@if (saveErrors().length) {
  <app-error-display [errors]="saveErrors()" />
}
<form [formGroup]="editForm" (ngSubmit)="save()">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>
  <div class="form-actions">
    <button matButton="filled" type="submit" [disabled]="editForm.invalid">Save</button>
  </div>
</form>
