<app-list-card
  heading="Organisations"
  createHeading="Create organisation"
  listHeading="All organisations"
  [resource]="orgsResource"
  loadError="Failed to load organisations."
>
  <div create>
    <app-request-feedback [status]="createStatus" />
    <form class="compact-form" [formGroup]="createForm" (ngSubmit)="submitCreate()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      <div class="form-actions">
        <button
          matButton="filled"
          type="submit"
          [disabled]="createForm.invalid || createStatus.pending()"
        >
          Create
        </button>
      </div>
    </form>

    @if (newOrgCredentials(); as credentials) {
      <section class="credentials-box">
        <strong
          >Organisation created — save these admin credentials now, they will not be shown
          again.</strong
        >
        <p>
          Admin username: <code>{{ credentials.adminUsername }}</code>
        </p>
        <p>
          Admin password: <code>{{ credentials.adminPassword }}</code>
        </p>
        <button matButton type="button" (click)="newOrgCredentials.set(null)">Dismiss</button>
      </section>
    }
  </div>

  <app-request-feedback [status]="deleteStatus" />
  <app-filtered-table [dataSource]="dataSource" filterExample="my-org">
    <table mat-table [dataSource]="dataSource">
      <mat-text-column name="id" headerText="ID" />
      <mat-text-column name="name" />
      <ng-container matColumnDef="actions" stickyEnd>
        <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
        <td mat-cell *matCellDef="let o">
          <div class="org-actions-container">
            <button
              type="button"
              [matButton]="selectedOrgId() === o.id ? 'filled' : 'outlined'"
              [attr.aria-pressed]="selectedOrgId() === o.id"
              [attr.aria-label]="'Select organisation ' + o.name"
              (click)="toggleManage(o)"
            >
              Select
            </button>
            <app-row-actions
              [label]="'organisation ' + o.name"
              (edit)="selectedOrg.set(o)"
              (delete)="deleteOrg(o)"
            />
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </app-filtered-table>

  @if (selectedOrg(); as org) {
    <app-rename-panel
      heading="Edit organisation"
      [item]="org"
      [rename]="renameOrganisation"
      (saved)="onDetailSaved()"
      (closed)="selectedOrg.set(null)"
    />
  }
</app-list-card>
