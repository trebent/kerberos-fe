<app-edit-panel [heading]="heading()" (closed)="closed.emit()">
  <app-request-feedback [status]="saveStatus" />

  <form class="compact-form" [formRoot]="form">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [formField]="form.name" />
    </mat-form-field>
    <div class="form-actions">
      <button
        matButton="filled"
        type="submit"
        [disabled]="form().invalid() || saveStatus.pending()"
      >
        Save
      </button>
    </div>
  </form>
</app-edit-panel>
