<div class="meta-row">
  <span class="meta-label">ID</span>
  <span class="meta-value">{{ call().id }}</span>
</div>
<div class="meta-row">
  <span class="meta-label">Method</span>
  <span class="meta-value mono">{{ call().method }}</span>
</div>
<div class="meta-row">
  <span class="meta-label">Status</span>
  <span class="meta-value mono" [class]="statusClass()">{{ call().statusCode }}</span>
</div>
<div class="meta-row">
  <span class="meta-label">URL</span>
  <span class="meta-value mono">{{ call().url }}</span>
</div>
<div class="meta-row">
  <span class="meta-label">Started</span>
  <span class="meta-value">{{ call().startedAt | date: 'medium' }}</span>
</div>
<div class="meta-row">
  <span class="meta-label">Stopped</span>
  <span class="meta-value">{{ call().stoppedAt | date: 'medium' }}</span>
</div>
<div class="meta-row">
  <span class="meta-label">Duration</span>
  <span class="meta-value mono">{{ duration() }}</span>
</div>
