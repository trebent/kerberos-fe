<dl class="meta-list">
  <dt>ID</dt>
  <dd>{{ call().id }}</dd>
  <dt>Method</dt>
  <dd class="mono">{{ call().method }}</dd>
  <dt>Status</dt>
  <dd class="mono" [class]="statusClass()">{{ call().statusCode }}</dd>
  <dt>URL</dt>
  <dd class="mono">{{ call().url }}</dd>
  <dt>Started</dt>
  <dd>{{ call().startedAt | date: 'medium' }}</dd>
  <dt>Stopped</dt>
  <dd>{{ call().stoppedAt | date: 'medium' }}</dd>
  <dt>Duration</dt>
  <dd class="mono">{{ duration() }}</dd>
</dl>
