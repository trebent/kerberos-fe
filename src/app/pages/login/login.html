<div class="page page-narrow">
  <h1 class="page-title">Sign in to Kerberos</h1>

  @if (errors().length) {
    <app-error-display [errors]="errors()" />
  }

  <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field>
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" autocomplete="username" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
    </mat-form-field>

    <mat-slide-toggle formControlName="superLogin">Sign in as superuser</mat-slide-toggle>

    <button matButton="filled" type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
