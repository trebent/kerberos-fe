<app-edit-dialog heading="Add group">
  <app-request-feedback [status]="createStatus" />

  <form class="dialog-form" [formRoot]="form">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput cdkFocusInitial [formField]="form.name" />
    </mat-form-field>

    <app-checkbox-group
      legend="Permissions"
      [items]="permissionsResource.value() ?? []"
      [loading]="permissionsResource.isLoading()"
      [selection]="selectedPermissions"
    />
    @if (permissionsResource.error()) {
      <app-error-display [errors]="['Failed to load permissions.']" />
    }

    <div class="form-actions">
      <button matButton type="button" mat-dialog-close>Cancel</button>
      <button
        matButton="filled"
        type="submit"
        [disabled]="form().invalid() || createStatus.pending()"
      >
        Create
      </button>
    </div>
  </form>
</app-edit-dialog>
