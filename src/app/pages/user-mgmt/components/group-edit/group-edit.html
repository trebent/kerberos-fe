<app-edit-dialog heading="Edit group">
  <app-request-feedback [status]="saveStatus" />

  <form class="compact-form" [formRoot]="editForm">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput cdkFocusInitial [formField]="editForm.name" />
    </mat-form-field>

    @if (permissionsResource.isLoading()) {
      <mat-spinner diameter="24" aria-label="Loading" />
    }
    @if (permissionsResource.hasValue()) {
      <app-checkbox-group
        legend="Permissions"
        [items]="permissionsResource.value()"
        [selection]="selectedPermissions"
      />
    }

    <div class="form-actions">
      <button
        matButton="filled"
        type="submit"
        [disabled]="editForm().invalid() || saveStatus.pending()"
      >
        Save
      </button>
    </div>
  </form>
</app-edit-dialog>
