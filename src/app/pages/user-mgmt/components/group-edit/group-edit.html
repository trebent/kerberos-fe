<div class="edit-header">
  <h3 class="edit-title">Edit Group</h3>

  <button matIconButton type="button" (click)="close()" aria-label="Close edit panel">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>
@if (saveErrors().length) {
  <app-error-display [errors]="saveErrors()" />
}

<form class="compact-form" [formGroup]="editForm" (ngSubmit)="save()">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  @if (permissionsResource.isLoading()) {
    <mat-spinner diameter="24" aria-label="Loading" />
  }
  @if (permissionsResource.hasValue()) {
    <fieldset class="checkbox-fieldset">
      <legend>Permissions</legend>
      @for (p of permissionsResource.value()!; track p.id) {
        <mat-checkbox [checked]="isSelected(p.id)" (change)="togglePermission(p.id)">
          {{ p.name }}
        </mat-checkbox>
      }
    </fieldset>
  }

  <div class="form-actions">
    <button matButton="filled" type="submit" [disabled]="editForm.invalid">Save</button>
  </div>
</form>
