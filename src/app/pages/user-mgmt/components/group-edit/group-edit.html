<app-edit-panel heading="Edit group" (closed)="closed.emit()">
  @if (saveErrors().length) {
    <app-error-display [errors]="saveErrors()" />
  }

  <form [formGroup]="editForm" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    @if (permissionsResource.isLoading()) {
      <mat-spinner diameter="24" aria-label="Loading" />
    }
    @if (permissionsResource.hasValue()) {
      <fieldset class="permissions-fieldset">
        <legend>Permissions</legend>
        @for (p of permissionsResource.value()!; track p.id) {
          <mat-checkbox
            [checked]="selectedPermissions.has(p.id)"
            (change)="selectedPermissions.toggle(p.id)"
          >
            {{ p.name }}
          </mat-checkbox>
        }
      </fieldset>
    }

    <div class="form-actions">
      <button matButton="filled" type="submit" [disabled]="editForm.invalid">Save</button>
    </div>
  </form>
</app-edit-panel>
