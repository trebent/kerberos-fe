<app-edit-dialog heading="Edit group">
  <app-request-feedback [status]="saveStatus" />

  <form class="dialog-form" [formRoot]="editForm">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput cdkFocusInitial [formField]="editForm.name" />
    </mat-form-field>

    <app-checkbox-group
      legend="Permissions"
      [items]="permissionsResource.value() ?? []"
      [loading]="permissionsResource.isLoading()"
      [selection]="selectedPermissions"
    />
    @if (permissionsResource.error()) {
      <app-error-display [errors]="['Failed to load permissions.']" />
    }

    <div class="form-actions">
      <button matButton type="button" [mat-dialog-close]="undefined">Cancel</button>
      <button
        matButton="filled"
        type="submit"
        [disabled]="editForm().invalid() || saveStatus.pending()"
      >
        Save
      </button>
    </div>
  </form>
</app-edit-dialog>
