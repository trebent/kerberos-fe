<app-list-card
  heading="Groups"
  createHeading="Create group"
  listHeading="All groups"
  [resource]="groupsResource"
  loadError="Failed to load groups."
>
  <div create>
    <app-request-feedback [status]="createStatus" />

    <form class="compact-form" [formGroup]="createForm" (ngSubmit)="submitCreate()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      @if (permissionsResource.hasValue()) {
        <fieldset class="checkbox-fieldset">
          <legend>Permissions</legend>
          @for (p of permissionsResource.value(); track p.id) {
            <mat-checkbox
              [checked]="createPermissions.has(p.id)"
              (change)="createPermissions.toggle(p.id)"
            >
              {{ p.name }}
            </mat-checkbox>
          }
        </fieldset>
      }
      <div class="form-actions">
        <button
          matButton="filled"
          type="submit"
          [disabled]="createForm.invalid || createStatus.pending()"
        >
          Create
        </button>
      </div>
    </form>
  </div>

  <app-request-feedback [status]="deleteStatus" />
  <app-filtered-table [dataSource]="dataSource" filterExample="admin">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let g">{{ g.id }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let g">{{ g.name }}</td>
      </ng-container>
      <ng-container matColumnDef="permissions">
        <th mat-header-cell *matHeaderCellDef>Permissions</th>
        <td mat-cell *matCellDef="let g">{{ getPermissionIDs(g) }}</td>
      </ng-container>
      <ng-container matColumnDef="actions" stickyEnd>
        <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
        <td mat-cell *matCellDef="let g">
          <app-row-actions
            [label]="'group ' + g.name"
            (edit)="selectedGroup.set(g)"
            (delete)="deleteGroup(g)"
          />
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </app-filtered-table>

  @if (selectedGroup(); as group) {
    <app-group-edit [group]="group" (saved)="onDetailSaved()" (closed)="selectedGroup.set(null)" />
  }
</app-list-card>
