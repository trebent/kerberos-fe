<div class="card-header-container">
  <h2 class="section-title">Permissions</h2>
</div>
<div class="list-body" [attr.aria-busy]="permissionsResource.isLoading()">
  <p class="visually-hidden" role="status">
    {{ permissionsResource.isLoading() ? 'Loading permissions…' : '' }}
  </p>

  @if (permissionsResource.error()) {
    <div class="messages">
      <app-error-display [errors]="['Failed to load permissions.']" />
    </div>
  }

  <table mat-table [dataSource]="showSkeleton() ? [] : (permissionsResource.value() ?? [])">
    <mat-text-column name="id" headerText="ID" />
    <mat-text-column name="name" />
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (showSkeleton()) {
    @for (row of skeletonRows; track row) {
      <div class="skeleton-row">
        <app-skeleton width="1.5rem" />
        <app-skeleton [width]="row" />
      </div>
    }
  }
</div>
