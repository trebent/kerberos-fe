<div class="card-header-container">
  <h2 class="section-title">Profile</h2>
</div>
<div class="card-content">
  <p class="profile-info">
    <mat-icon class="profile-icon">account_circle</mat-icon>
    <span>{{ authService.isSuperuser() ? 'Superuser' : authService.username() }}</span>
  </p>

  @if (!authService.isSuperuser()) {
    <h3>Change username</h3>

    <app-request-feedback [status]="usernameStatus" />

    <form class="compact-form" [formRoot]="usernameForm">
      <mat-form-field appearance="outline">
        <mat-label>New username</mat-label>
        <input matInput [formField]="usernameForm.newUsername" autocomplete="username" />
      </mat-form-field>

      <button
        matButton="filled"
        type="submit"
        [disabled]="usernameForm().invalid() || usernameStatus.pending()"
      >
        Update username
      </button>
    </form>
    <mat-divider />
  }

  <h3>Change password</h3>
  <app-password-change [change]="changePassword" />
</div>
