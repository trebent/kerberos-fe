<app-edit-dialog heading="Edit user">
  <app-request-feedback [status]="saveStatus" />

  <form class="compact-form" [formRoot]="editForm">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput cdkFocusInitial [formField]="editForm.username" autocomplete="username" />
    </mat-form-field>

    @if (groupsResource.isLoading()) {
      <mat-spinner diameter="24" aria-label="Loading" />
    }

    @if (groupsResource.hasValue()) {
      <app-checkbox-group
        legend="Groups"
        [items]="groupsResource.value()"
        [selection]="selectedGroups"
      />
    }

    <div class="form-actions">
      <button
        matButton="filled"
        type="submit"
        [disabled]="editForm().invalid() || saveStatus.pending()"
      >
        Save
      </button>
    </div>
  </form>
</app-edit-dialog>
