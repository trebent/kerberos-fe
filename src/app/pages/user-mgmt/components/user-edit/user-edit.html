<app-edit-panel heading="Edit user" (closed)="closed.emit()">
  <app-request-feedback [status]="saveStatus" />

  <form class="compact-form" [formRoot]="editForm">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput [formField]="editForm.username" autocomplete="username" />
    </mat-form-field>

    @if (groupsResource.isLoading()) {
      <mat-spinner diameter="24" aria-label="Loading" />
    }

    @if (groupsResource.hasValue()) {
      <fieldset class="checkbox-fieldset">
        <legend>Groups</legend>
        @for (g of groupsResource.value(); track g.id) {
          <mat-checkbox [checked]="selectedGroups.has(g.id)" (change)="selectedGroups.toggle(g.id)">
            {{ g.name }}
          </mat-checkbox>
        }
      </fieldset>
    }

    <div class="form-actions">
      <button
        matButton="filled"
        type="submit"
        [disabled]="editForm().invalid() || saveStatus.pending()"
      >
        Save
      </button>
    </div>
  </form>
</app-edit-panel>
