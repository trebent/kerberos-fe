<div class="card-header-container">
  <h2 class="section-title">Users</h2>
</div>
<div class="card-content">
  <h3>Create User</h3>
  @if (createErrors().length) {
    <app-error-display [errors]="createErrors()" />
  }
  <form [formGroup]="createForm" (ngSubmit)="submitCreate()">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" autocomplete="username" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="new-password" />
    </mat-form-field>
    <div class="form-actions">
      <button matButton="filled" type="submit" [disabled]="createForm.invalid">Create</button>
    </div>
  </form>

  <mat-divider />
  <h3>All users</h3>

  @if (usersResource.error()) {
    <app-error-display [errors]="['Failed to load users.']" />
  }

  @if (usersResource.isLoading()) {
    <mat-spinner diameter="32" aria-label="Loading" />
  }

  @if (deleteErrors().length) {
    <app-error-display [errors]="deleteErrors()" />
  }

  <mat-form-field class="filter-field">
    <mat-label>Filter</mat-label>
    <input matInput (input)="applyFilter($event)" placeholder="Ex. admin" />
  </mat-form-field>
  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let u">{{ u.id }}</td>
      </ng-container>
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let u">{{ u.username }}</td>
      </ng-container>
      <ng-container matColumnDef="groups">
        <th mat-header-cell *matHeaderCellDef>Groups</th>
        <td mat-cell *matCellDef="let u">
          {{ groupNames(u) }}
        </td>
      </ng-container>
      <ng-container matColumnDef="actions" stickyEnd>
        <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
        <td mat-cell *matCellDef="let u">
          <button
            matIconButton
            type="button"
            (click)="openEdit(u)"
            [attr.aria-label]="'Edit user ' + u.username"
          >
            <mat-icon aria-hidden="true">edit</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            (click)="deleteUser(u.id)"
            [attr.aria-label]="'Delete user ' + u.username"
          >
            <mat-icon aria-hidden="true">delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons />
  </div>

  @if (selectedUser()) {
    <app-user-edit [user]="selectedUser()!" (saved)="onDetailSaved()" (closed)="onDetailClosed()" />
  }
</div>
