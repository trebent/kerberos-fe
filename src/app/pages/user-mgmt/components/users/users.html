<app-list-card
  heading="Users"
  addLabel="Add user"
  filterExample="alice"
  [resource]="usersResource"
  [dataSource]="dataSource"
  (add)="addUser()"
>
  <app-request-feedback [status]="deleteStatus" />
  <table mat-table [dataSource]="dataSource">
    <mat-text-column name="id" headerText="ID" />
    <mat-text-column name="username" />
    <ng-container matColumnDef="groups">
      <th mat-header-cell *matHeaderCellDef>Groups</th>
      <td mat-cell *matCellDef="let u">
        {{ joinNames(u.groups) }}
      </td>
    </ng-container>
    <ng-container matColumnDef="actions" stickyEnd>
      <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
      <td mat-cell *matCellDef="let u">
        <app-row-actions
          [label]="'user ' + u.username"
          (edit)="editUser(u)"
          (delete)="deleteUser(u)"
        />
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</app-list-card>
